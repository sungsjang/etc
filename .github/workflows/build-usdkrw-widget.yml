name: Build USDKRW Widget

on:
  push:
    branches: [ main ]
    paths:
      - 'usdkrw-widget/**'
      - '.github/workflows/build-usdkrw-widget.yml'
  pull_request:
    paths:
      - 'usdkrw-widget/**'
      - '.github/workflows/build-usdkrw-widget.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore usdkrw-widget/UsdKrwWidget.csproj

      - name: Build
        run: dotnet build usdkrw-widget/UsdKrwWidget.csproj -c Release --no-restore

      - name: Publish single EXE
        run: dotnet publish usdkrw-widget/UsdKrwWidget.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true -o usdkrw-widget/dist/win-x64

      - name: Create distribution ZIP
        shell: pwsh
        run: |
          $packageDir = 'usdkrw-widget/dist/package'
          $zipPath = 'usdkrw-widget/dist/UsdKrwWidget-v1.0.0-win-x64.zip'
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item 'usdkrw-widget/dist/win-x64/UsdKrwWidget.exe' "$packageDir/UsdKrwWidget.exe"
          @'
          USD/KRW Widget v1.0.0

          1. Extract this ZIP to any folder.
          2. Run UsdKrwWidget.exe.
          3. No API key is required. Exchange-rate data is retrieved from Naver Finance.
          4. Windows SmartScreen may warn because this personal utility is not code-signed.

          Source: https://github.com/sungsjang/etc/tree/main/usdkrw-widget
          '@ | Set-Content -Path "$packageDir/README.txt" -Encoding UTF8
          Compress-Archive -Path "$packageDir/*" -DestinationPath $zipPath -Force

      - name: Upload ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: UsdKrwWidget-v1.0.0-win-x64
          path: usdkrw-widget/dist/UsdKrwWidget-v1.0.0-win-x64.zip
          if-no-files-found: error
