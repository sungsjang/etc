name: Build USDKRW Widget

on:
  push:
    branches: [ main ]
    paths:
      - 'usdkrw-widget/**'
      - '.github/workflows/build-usdkrw-widget.yml'
  pull_request:
    paths:
      - 'usdkrw-widget/**'
      - '.github/workflows/build-usdkrw-widget.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore usdkrw-widget/UsdKrwWidget.csproj

      - name: Build
        run: dotnet build usdkrw-widget/UsdKrwWidget.csproj -c Release --no-restore

      - name: Verify self-contained publish
        run: dotnet publish usdkrw-widget/UsdKrwWidget.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true -o usdkrw-widget/dist/ci-check

      - name: Verify executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path 'usdkrw-widget/dist/ci-check/UsdKrwWidget.exe')) {
            throw 'UsdKrwWidget.exe was not produced.'
          }
          Write-Host 'Build verification succeeded. Executable artifacts are intentionally not uploaded.'
